<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Surpresa de Páscoa</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .botao-surpresa { background-color: #ffcc00; padding: 15px 30px; font-size: 18px; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; }
        #conteudo { display: none; margin-top: 20px; }
        img { width: 100%; border-radius: 10px; margin-bottom: 15px; border: 2px solid #5d3fd3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Uma surpresa para você! 🍫</h1>
        <button class="botao-surpresa" onclick="revelar()">ABRIR SURPRESA ✨</button>
        
        <div id="conteudo">
            <audio id="musica"><source src="musica.mp3" type="audio/mpeg"></audio>
            
            <img src="cordeiro.jpg" alt="Cordeiro">
            <p>"Ele se entregou por nós..."</p>
            
            <img src="cruz.jpg" alt="Cruz">
            <p>"Pagou o preço na cruz."</p>
            
            <img src="ressurreicao.jpg" alt="Ressurreição">
            <p>"Ele RESSUSCITOU!"</p>
            
            <img src="leao-presente.jpg" alt="Leão">
            <p>"O Leão da Tribo de Judá!"</p>
        </div>
    </div>
    <script>
        function revelar() {
            document.getElementById('conteudo').style.display = 'block';
            var som = document.getElementById('musica');
            som.play();
            document.querySelector('.botao-surpresa').style.display = 'none';
        }
    </script>
</body>
</html>
