<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Foi Por Amor</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #1e90ff;
  text-align: center;
  color: white;
}

#inicio {
  position: fixed;
  width: 100%;
  height: 100%;
  background: #1e90ff;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 10;
}

.container {
  display: none;
  padding: 30px 20px;
}

.quadro {
  margin: 40px auto;
  max-width: 350px;
}

h2 {
  font-size: 22px;
}

p {
  font-size: 16px;
  line-height: 1.6;
}

img {
  max-width: 100%;
  border-radius: 12px;
  margin-top: 15px;
}

#leao {
  animation: explosao 1.5s ease-out;
}

@keyframes explosao {
  0% { transform: scale(0.5); opacity: 0; }
  60% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); }
}
</style>

</head>

<body>

<div id="inicio" onclick="comecar()">
  <h1>▶ Clique para começar</h1>
  <p>Uma história de amor que mudou tudo...</p>
</div>

<audio id="musica" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<div class="container">

  <div class="quadro">
    <h2>Ele poderia ter ido embora...</h2>
    <p>Mas escolheu ficar por amor.</p>
    <img src="cordeiro.jpg">
  </div>

  <div class="quadro">
    <h2>Ele carregou a cruz</h2>
    <p>O que era nosso… Ele levou.</p>
    <img src="cruz.jpg">
  </div>

  <div class="quadro">
    <h2>Parecia o fim</h2>
    <p>O silêncio tomou conta.</p>
    <img src="tumba.jpg">
  </div>

  <div class="quadro">
    <h2>Mas Ele vive! 🦁</h2>
    <p>A morte foi vencida.</p>
    <img src="leao.jpg" id="leao">
  </div>

  <div class="quadro">
    <h2>Foi por você 💛</h2>
    <p>Um amor que nunca acaba.</p>
  </div>

</div>

<script>
function comecar() {
  document.getElementById("inicio").style.display = "none";
  document.querySelector(".container").style.display = "block";

  var audio = document.getElementById("musica");
  audio.play().catch(() => {});
}
</script>

</body>
</html>
