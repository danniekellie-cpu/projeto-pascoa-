<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Foi Por Amor</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
  color: white;
  background: linear-gradient(-45deg, #87CEFA, #bde0fe, #e0f7ff, #cfe9ff);
  background-size: 400% 400%;
  animation: ceuMovendo 10s ease infinite;
}

@keyframes ceuMovendo {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* NUVENS */
.nuvens {  
  position: fixed;  
  top: 0;  
  left: 0;  
  width: 200%;  
  height: 100%;  
  background: url('https://i.imgur.com/3ZQ3Z4V.png') repeat-x;  
  opacity: 0.3;  
  animation: nuvensMovendo 60s linear infinite;  
  z-index: 0;  
}  

@keyframes nuvensMovendo {  
  from { transform: translateX(0); }  
  to { transform: translateX(-50%); }  
}

/* SEÇÕES */
section {
  height: 100vh;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  position: relative;
  z-index: 1;
}

/* TEXTO */
.fade {
  opacity: 0;
  transform: translateY(30px);
  transition: 1.5s;
}

.fade.aparecer {
  opacity: 1;
  transform: translateY(0);
}

/* IMAGENS */
img {
  max-width: 280px;
  margin-top: 20px;
  border-radius: 12px;
  opacity: 0;
  transform: scale(0.8);
  transition: 1.5s;
}

img.aparecer {
  opacity: 1;
  transform: scale(1);
}

/* LEÃO EXPLOSÃO */
#leao {
  animation: explosao 2s ease-out forwards;
}

@keyframes explosao {
  0% { transform: scale(0.5); opacity: 0; filter: brightness(1); }
  50% { transform: scale(1.3); opacity: 1; filter: brightness(3); }
  100% { transform: scale(1); filter: brightness(1.5); }
}

/* TELA INICIAL */
#inicio {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
  flex-direction: column;
  text-align: center;
}

#inicio h1 {
  animation: piscar 1.5s infinite;
}

@keyframes piscar {
  0% {opacity: 1;}
  50% {opacity: 0.4;}
  100% {opacity: 1;}
}
</style>
</head>

<body>

<div id="inicio" onclick="comecar()">
  <h1>▶ Clique para começar</h1>
  <p>Uma história de amor...</p>
</div>

<div class="nuvens"></div>

<audio id="musica" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<section>
  <h1 class="fade">Ele não fugiu...</h1>
  <p class="fade">Como um cordeiro, Ele ficou por amor.</p>
  <img src="cordeiro.jpg">
</section>

<section>
  <h1 class="fade">A cruz carregou tudo</h1>
  <p class="fade">Era nosso... mas Ele tomou o lugar.</p>
  <img src="cruz.jpg">
</section>

<section>
  <h1 class="fade">Parecia o fim...</h1>
  <p class="fade">O silêncio tomou conta.</p>
  <img src="tumba.jpg">
</section>

<section>
  <h1 class="fade">MAS ELE VIVE!</h1>
  <p class="fade">A morte foi vencida! 🦁🔥</p>
  <img src="leao.jpg" id="leao">
</section>

<section>
  <h1 class="fade">Foi por você</h1>
  <p class="fade">Um amor que venceu tudo.</p>
</section>

<script>
function comecar() {
  document.getElementById("inicio").style.display = "none";

  document.querySelectorAll("section").forEach(sec => {
    sec.style.display = "flex";
  });

  document.getElementById("musica").play();
}

const elementos = document.querySelectorAll(".fade, img");

window.addEventListener("scroll", () => {
  elementos.forEach(el => {
    const pos = el.getBoundingClientRect().top;

    if (pos < window.innerHeight - 50) {
      el.classList.add("aparecer");
    }
  });
});
</script>

</body>
</html>
